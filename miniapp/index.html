<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d12" />
    <title>Arkham Bot Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Request fullscreen only on mobile (android/ios). Exit immediately on desktop.
      (function () {
        try {
          var app = window.Telegram && window.Telegram.WebApp;
          if (!app) return;
          var mobile = ['android', 'ios'];
          if (mobile.indexOf(app.platform) !== -1) {
            app.requestFullscreen && app.requestFullscreen();
          } else {
            app.exitFullscreen && app.exitFullscreen();
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
