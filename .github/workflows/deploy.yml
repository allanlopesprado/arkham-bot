name: Test Arkham Bot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m pytest -q
      - name: Help smoke test
        run: python main.py --help
      - name: Non-strict healthcheck smoke test
        run: python main.py healthcheck

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker
      - name: Validate Worker syntax
        run: node --check src/index.js
        working-directory: worker
      - name: Worker tests
        run: npm test
        working-directory: worker
      - name: Worker dry-run
        run: npm run dry-run
        working-directory: worker

  miniapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: miniapp/package-lock.json
      - name: Install Mini App dependencies
        run: npm ci
        working-directory: miniapp
      - name: Build Mini App
        run: npm run build
        working-directory: miniapp
