name: Test and Deploy Arkham Bot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m pytest -q
      - name: Help smoke test
        run: python main.py --help
      - name: Non-strict healthcheck smoke test
        run: python main.py healthcheck

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.ORACLE_PROJECT_PATH }}"
            PREV_REV="$(git rev-parse HEAD || true)"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            ./venv/bin/python -m pip install --upgrade pip
            ./venv/bin/python -m pip install -r requirements.txt
            ./venv/bin/python -m pip install -r requirements-dev.txt
            ./venv/bin/python -m pip install -e .
            ./venv/bin/python -m compileall -q .
            ./venv/bin/python -m pytest -q
            ./venv/bin/python main.py healthcheck --strict
            sudo systemctl restart arkham-bot
            sleep 5
            sudo systemctl is-active --quiet arkham-bot
            ./venv/bin/python main.py healthcheck --strict || {
              echo "Post-restart healthcheck failed; rolling back to ${PREV_REV}"
              git checkout "$PREV_REV"
              ./venv/bin/python -m pip install -r requirements.txt
              ./venv/bin/python -m pip install -r requirements-dev.txt
              ./venv/bin/python -m pip install -e .
              sudo systemctl restart arkham-bot
              exit 1
            }
